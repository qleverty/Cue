[package]
name = "cue"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.34.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"