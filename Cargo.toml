[package]
name = "cue"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.34.1", features = ["image"] }
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"